<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - PetCare</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="login-page">
    <div class="login-container">
        <h2>🐾 PetCare</h2>
        <p>Acesso restrito para funcionários</p>
        
        <form id="loginForm">
            <div class="input-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" value="professor@petcare.com" placeholder="seu@email.com" required>
            </div>
            
            <div class="input-group">
                <label for="senha">Senha</label>
                <input type="password" id="senha" value="professor123" placeholder="••••••••" required>
            </div>
            
            <div id="errorMessage" class="error-msg" style="display: none;"></div>
            
            <button type="submit" class="btn">Entrar</button>
        </form>
        <a href="index.html" class="link-voltar">← Voltar para a Área Pública</a>
    </div>

    <script src="../js/api.js"></script>
    <script src="../js/login.js"></script>
</body>
</html>
